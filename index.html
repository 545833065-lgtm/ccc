<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href='data:application/manifest+json,{"name":"考试系统","short_name":"考试","start_url":".","display":"standalone","background_color":"%230c4a6e","theme_color":"%230c4a6e","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<meta name="theme-color" content="#0c4a6e">
<title>电源与机房环境基础设施维护规程 · 在线考试系统</title>
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --brand:#0369a1; --brand-d:#0c4a6e; --brand-l:#f0f9ff;
  --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  --ok-l:#f0fdf4; --bad-l:#fef2f2; --warn-l:#fffbeb;
  --shadow:0 1px 3px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --shadow-lg:0 8px 30px rgba(15,23,42,.10);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:920px;margin:0 auto;padding:24px 18px 60px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);animation:fadeUp .3s ease}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}

/* hero */
.hero{background:linear-gradient(135deg,#0c4a6e 0%,#0369a1 55%,#0e7490 100%);color:#fff;border-radius:var(--r);padding:30px 28px;margin-bottom:16px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:40px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero h1{color:#fff;font-size:24px}
.hero .sub{color:rgba(255,255,255,.8)}
.hero-stats{display:flex;gap:24px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1}
.hero-stats .st b{font-size:22px;font-weight:700;display:block;line-height:1.2}
.hero-stats .st span{font-size:12px;color:rgba(255,255,255,.75)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:10px 22px;font-size:14px;cursor:pointer;transition:all .15s;font-weight:600;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#0369a1,#0e7490);color:#fff;box-shadow:0 2px 8px rgba(3,105,161,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(3,105,161,.35)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.btn-lg{padding:13px 36px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* setup options */
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.opt-item{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:13px;transition:all .15s;user-select:none;background:#fff}
.opt-item:hover{border-color:var(--brand);transform:translateY(-1px)}
.opt-item.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d);box-shadow:0 0 0 3px rgba(3,105,161,.08)}
.opt-item b{font-size:13px}
.opt-item small{color:var(--muted);font-weight:400;display:block;margin-top:2px}
label.fld{display:block;font-size:12px;color:var(--muted);margin:16px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
select,input[type=number]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:#fff;font-family:inherit;transition:border .15s}
select:focus,input[type=number]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(3,105,161,.1)}
.inline-row{display:flex;gap:14px;flex-wrap:wrap}
.inline-row>div{flex:1;min-width:150px}
.mode-tabs{display:flex;gap:12px;margin-top:10px}
.mode-tab{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:16px 12px;cursor:pointer;text-align:center;transition:all .15s;background:#fff}
.mode-tab:hover{border-color:var(--brand)}
.mode-tab.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d);box-shadow:0 0 0 3px rgba(3,105,161,.08)}
.mode-tab b{display:block;font-size:15px;margin-bottom:2px}
.mode-tab span{font-size:12px;color:var(--muted)}
.mode-tab.on span{color:var(--brand-d)}

/* exam top bar */
.topbar{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;z-index:10;flex-wrap:wrap;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.timer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand-d);background:var(--brand-l);padding:4px 14px;border-radius:8px;letter-spacing:.02em}
.timer.warn{color:var(--bad);background:var(--bad-l);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.progress{flex:1;min-width:100px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 12px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#0369a1,#0e7490);transition:width .25s}

/* question */
.qstem{font-size:17px;font-weight:600;margin-bottom:16px;line-height:1.7}
.qmeta{font-size:12px;color:var(--muted);margin-bottom:10px}
.tag{display:inline-block;padding:2px 10px;border-radius:6px;font-size:11px;margin-right:6px;font-weight:600}
.tag-s{background:#dbeafe;color:#1e40af}
.tag-m{background:#fef3c7;color:#92400e}
.tag-j{background:#ede9fe;color:#6b21a8}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px;cursor:pointer;transition:all .12s;display:flex;gap:12px;align-items:flex-start;background:#fff}
.opt:hover{border-color:var(--brand);background:var(--brand-l);transform:translateX(2px)}
.opt.sel{border-color:var(--brand);background:var(--brand-l);box-shadow:0 0 0 3px rgba(3,105,161,.1)}
.opt .k{font-weight:700;flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-l)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.disabled{cursor:default;pointer-events:none}
.opt.disabled:hover{transform:none;background:inherit}
.opt.disabled.correct:hover{background:var(--ok-l)}
.opt.disabled.wrong:hover{background:var(--bad-l)}
.judge-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge-opts .opt{justify-content:center;text-align:center;font-size:16px;font-weight:600;padding:18px}
.explain{margin-top:12px;padding:12px 16px;border-radius:10px;background:var(--warn-l);border-left:3px solid var(--warn);font-size:13px;color:#78350f}
.nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px}

/* palette */
.palette{display:grid;grid-template-columns:repeat(auto-fill,38px);gap:6px;margin-top:14px;justify-content:start}
.pcell{width:38px;height:38px;border:1.5px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:#fff;transition:all .12s}
.pcell:hover{border-color:var(--brand)}
.pcell.cur{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l);font-weight:700}
.pcell.done{background:var(--brand);color:#fff;border-color:var(--brand)}
.pcell.marked{background:var(--warn);color:#fff;border-color:var(--warn)}

/* result */
.score-ring{width:160px;height:160px;margin:0 auto 12px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .num b{font-size:42px;font-weight:800;line-height:1}
.score-ring .num span{font-size:12px;color:var(--muted);margin-top:2px}
.score-sub{text-align:center;color:var(--muted);margin-bottom:18px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.stat{text-align:center;padding:16px;border-radius:12px;background:var(--bg)}
.stat b{display:block;font-size:24px;font-weight:700}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.skip b{color:var(--muted)}
.qreview{border-left:3px solid var(--line);padding:14px 0 14px 18px;margin-bottom:16px}
.qreview.right{border-color:var(--ok)}
.qreview.wrong{border-color:var(--bad)}
.badge{display:inline-block;padding:2px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.badge.right{background:var(--ok)} .badge.wrong{background:var(--bad)}
.hidden{display:none!important}
.anchor{position:relative;top:-70px}
.wb-banner{background:linear-gradient(135deg,#fef2f2 0%,#fffbeb 100%);border:1px solid #fecaca;border-radius:var(--r);padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.wb-banner b{color:var(--bad)}
.wb-count{font-size:26px;font-weight:800;color:var(--bad)}

/* collapsible */
.collapse-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.collapse-head .arrow{transition:transform .2s;color:var(--muted);font-size:14px}
.collapse-head.open .arrow{transform:rotate(90deg)}
.collapse-body{overflow:hidden;transition:max-height .25s ease;max-height:2000px}
.collapse-body.closed{max-height:0}
.ch-summary{font-size:12px;color:var(--brand);font-weight:600;margin-left:8px}
.palette-toggle{cursor:pointer;user-select:none;color:var(--muted);font-size:13px}
.pal-group{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.pal-group-head{display:flex;align-items:center;gap:10px;padding:10px 12px!important;background:var(--bg);border-radius:0!important}
.pal-group-head:hover{background:var(--brand-l)}
.pal-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pal-tab{padding:6px 12px;border:1.5px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;background:#fff;transition:.15s;user-select:none}
.pal-tab small{color:var(--muted)}
.pal-tab:hover{border-color:var(--brand)}
.pal-tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pal-tab.on small{color:#bae6fd}

/* history */
.hist-item{padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;transition:.15s;background:#fff}
.hist-item:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.hist-score{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0;color:#fff}
.hist-score.pass{background:linear-gradient(135deg,#16a34a,#15803d)}
.hist-score.fail{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.hist-main{flex:1;min-width:0}
.hist-main .t{font-weight:600;font-size:14px}
.hist-main .d{font-size:12px;color:var(--muted);margin-top:2px}
.hist-side{text-align:right;font-size:12px;color:var(--muted);flex-shrink:0}
.hist-side b{color:var(--ink);font-size:14px}
.hist-empty{text-align:center;padding:40px 20px;color:var(--muted)}
.hist-empty .ic{font-size:40px;margin-bottom:8px}

/* login */
.login-wrap{min-height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);padding:36px 32px;border:1px solid var(--line)}
.login-logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#0c4a6e,#0e7490);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px}
.login-card h2{text-align:center;font-size:20px;margin-bottom:4px}
.login-card .tip{text-align:center;font-size:12px;color:var(--muted);margin-bottom:22px}
.login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:12px;font-family:inherit}
.login-card input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(3,105,161,.1)}
.login-card .btn{width:100%;justify-content:center;padding:13px}
.login-err{color:var(--bad);font-size:13px;text-align:center;margin-top:10px;min-height:18px}
.user-chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-l);color:var(--brand-d);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.user-chip .out{cursor:pointer;color:var(--bad);margin-left:4px}
@media(max-width:640px){
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .hero-stats{gap:14px}
  .mode-tabs{flex-direction:column}
  .hero{padding:22px 18px}
  .hero h1{font-size:19px}
  .hero-stats .st b{font-size:18px}
  .card{padding:18px 14px;border-radius:12px}
  .qstem{font-size:16px}
  .opt{padding:13px 14px;font-size:15px}
  .topbar{padding:10px 14px}
  .timer{font-size:16px;padding:3px 10px}
  .palette{grid-template-columns:repeat(auto-fill,34px);gap:5px}
  .pcell{width:34px;height:34px;font-size:11px}
  .login-card{padding:28px 20px}
  .wb-banner{padding:14px}
  .nav .btn{padding:10px 16px;font-size:13px}
}
</style>
</head>

  document.querySelectorAll('#chGrid .opt-item').forEach(el=>{

    $('typeBody').classList.toggle('closed');

  $('selAll').onclick = ()=>{document.querySelectorAll('#chGrid .opt-item').forEach(e=>e.classList.add('on'));updateChSummary();};
  $('selNone').onclick = ()=>{document.querySelectorAll('#chGrid .opt-item').forEach(e=>e.classList.remove('on'));updateChSummary();};
  document.querySelectorAll('.mode-tab').forEach(t=>{

      $('qTime').value = 60;
      $('shuffleChk').checked = true;
    } else {
      $('qCount').value = 0;
      $('qTime').value = 0;
      $('shuffleChk').checked = false;

  $('startBtn').onclick = ()=>{ state.onlyWrong=false; startExam(); };

      ats.style.display = 'block';
    }

function renderHistory(){
  const hist = loadHistory();
  app.innerHTML = `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div><h1>📊 历史成绩</h1>
      <div class="sub">共 ${hist.length} 次考试记录${hist.length>0?` · 平均 ${Math.round(hist.reduce((s,r)=>s+r.score,0)/hist.length)} 分 · 最高 ${Math.max(...hist.map(r=>r.score))} 分 · 最低 ${Math.min(...hist.map(r=>r.score))} 分`:''}</div></div>
      <div class="row">
        <button class="btn btn-ghost" id="backBtn">← 返回</button>
        ${hist.length>0?'<button class="btn btn-ghost" id="clearHistBtn" style="color:var(--bad);border-color:#fecaca">清空记录</button>':''}
      </div>
    </div>
    <div id="histList"></div>
  </div>`;
  $('backBtn').onclick = renderSetup;
  const ch = $('clearHistBtn');
  if(ch) ch.onclick = ()=>{ if(confirm('确定清空所有历史成绩吗？此操作不可恢复。')){ localStorage.removeItem(HIS_KEY); renderHistory(); } };
  const box = $('histList');
  if(hist.length===0){
    box.innerHTML = `<div class="hist-empty"><div class="ic">📭</div>还没有考试记录<br><small>完成一次考试后会自动记录成绩</small></div>`;
    return;
  }
  box.innerHTML = hist.map((r,i)=>{
    const d = new Date(r.date);
    const dt = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const mm = Math.floor(r.seconds/60), ss = r.seconds%60;
    const mlabel = r.mode==='practice' ? '练习' : (r.onlyWrong?'错题本':'考试');
    const wIds = r.wrongIds||[];
    const wqs = wIds.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
    let wHtml = '';
    if(wqs.length>0){
      wHtml = `<div class="hist-wrong" id="hw_${i}" style="display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">
        <div style="font-size:12px;color:var(--bad);margin-bottom:10px;font-weight:600">📕 本次答错 ${wqs.length} 题（点 ☆ 加入/移出错题本）：</div>
        ${wqs.map(q=>{
          const inWB = wrongBook.has(q.id);
          const typeTag = q.type==='single'?'<span class="tag tag-s">单选</span>':q.type==='multi'?'<span class="tag tag-m">多选</span>':'<span class="tag tag-j">判断</span>';
          let caStr = q.type==='judge'?(q.answer?'正确':'错误'):q.answer.join('');
          let optsHtml = '';
          if(q.type!=='judge'){
            optsHtml = q.options.map(o=>{
              const isCa = q.answer.includes(o.key);
              return `<div style="font-size:13px;padding:4px 0;${isCa?'color:var(--ok);font-weight:600':''}">${o.key}. ${o.text}${isCa?' ✓':''}</div>`;
            }).join('');
          } else {
            optsHtml = `<div style="font-size:13px;padding:4px 0;color:var(--ok);font-weight:600">${q.answer?'✓ 正确':'✗ 错误'}</div>`;
          }
          return `<div style="padding:10px 0;border-bottom:1px solid var(--bg)">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
              <div style="flex:1">
                <div style="margin-bottom:6px">${typeTag}</div>
                <div style="font-size:14px;font-weight:600;line-height:1.5">${q.stem}</div>
              </div>
              <button data-favid="${q.id}" style="background:none;border:none;cursor:pointer;font-size:20px;flex-shrink:0;padding:4px">${inWB?'⭐':'☆'}</button>
            </div>
            <div style="margin-top:8px;padding-left:4px">${optsHtml}</div>
            <div style="font-size:12px;margin-top:6px;color:var(--muted)">正确答案：<b style="color:var(--ok)">${caStr}</b>${q.chapter?' · '+q.chapter:''}</div>
          </div>`;
        }).join('')}
      </div>`;
    }
    return `<div class="hist-item" style="cursor:pointer" onclick="const b=$('hw_${i}');if(b)b.style.display=b.style.display==='none'?'block':'none'">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="hist-score ${r.score>=60?'pass':'fail'}">${r.score}</div>
        <div class="hist-main">
          <div class="t">第 ${hist.length-i} 次 · <span class="tag tag-s">${mlabel}</span> ${r.total} 题</div>
          <div class="d">${dt} · 用时 ${mm}分${ss}秒${wqs.length>0?` · <span style="color:var(--bad)">点此查看 ${wqs.length} 道错题 ▾</span>`:''}</div>
        </div>
        <div class="hist-side">
          <div>答对 <b style="color:var(--ok)">${r.right}</b> · 错 <b style="color:var(--bad)">${r.wrong}</b>${r.skip>0?` · 未答 <b>${r.skip}</b>`:''}</div>
          <div style="margin-top:2px">${r.score>=60?'✅ 通过':'❌ 未通过'}</div>
        </div>
      </div>
      ${wHtml}
    </div>`;
  }).join('');

  // 绑定错题本收藏按钮
  document.querySelectorAll('[data-favid]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = +btn.dataset.favid;
      if(wrongBook.has(id)){ wrongBook.delete(id); btn.textContent='☆'; }
      else { wrongBook.add(id); btn.textContent='⭐'; }
      saveWB(wrongBook);
    };
  });
}

function startExam(){
  const qType = $('qType').value;
  const qCount = +$('qCount').value||0;
  const qTime = +$('qTime').value||0;
  state.mode = document.querySelector('.mode-tab.on').dataset.mode;
  state.shuffle = $('shuffleChk').checked;

  let pool;
  if(state.onlyWrong){
    // 错题本模式：只从错题本里抽，题型仍受 qType 限制
    pool = QUESTIONS.filter(q=> wrongBook.has(q.id) && (qType==='all'||q.type===qType));
    if(pool.length===0){ alert('错题本里没有符合条件的题目'); state.onlyWrong=false; return; }
  } else {
    const selCh = new Set([...document.querySelectorAll('#chGrid .opt-item.on')].map(e=>+e.dataset.ch));
    if(selCh.size===0){alert('请至少选择一个章节');return;}
    pool = QUESTIONS.filter(q=>{
      const ci = CHAPTERS.findIndex(c=>c.title===q.chapter);
      return selCh.has(ci) && (qType==='all'||q.type===qType);
    });
  }
  if(pool.length===0){alert('所选条件下没有题目');return;}
  /* 不重复已做过的题 */
  const noRepeat = $('noRepeatChk') && $('noRepeatChk').checked;
  if(noRepeat && !state.onlyWrong){
    const before = pool.length;
    pool = pool.filter(q=>!doneSet.has(q.id));
    if(pool.length===0){ alert(`所有选范围内的题都已做过（共${before}题）\n请取消"不重复已做过的题"或换个章节。`); return; }
    if(pool.length<before){ console.log(`不重复模式：排除${before-pool.length}道已做题，剩余${pool.length}题`); }
  }
  if(state.shuffle){
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  }
  if(qCount>0 && qCount<pool.length) pool = pool.slice(0,qCount);
  state.list = pool;
  state.answers = {};
  state.submitted = {};
  state.remain = qTime*60;
  state.seconds = 0;
  state.screen = 'exam';

  // 练习模式：恢复上次进度
  let startIdx = 0;
  if(state.mode==='practice' && !state.onlyWrong){
    try{
      const prg = JSON.parse(localStorage.getItem(PRG_KEY)||'null');
      if(prg && prg.total===pool.length && prg.idx>0 && prg.idx<pool.length){
        startIdx = prg.idx;
      }
    }catch(e){}
  }
  state.idx = startIdx;

  if(state.timerId) clearInterval(state.timerId);
  if(qTime>0){
    state.timerId = setInterval(tick,1000);
  }
  renderExam();
  if(startIdx>0){
    setTimeout(()=>alert(`欢迎回来，已为你恢复进度：上次做到第 ${startIdx+1} 题（共 ${pool.length} 题），继续加油！`),100);
  }
}

function tick(){
  state.remain--;
  state.seconds++;
  const t = $('timer');
  if(t){
    const m = Math.floor(state.remain/60), s = state.remain%60;
    t.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(state.remain<=60) t.classList.add('warn');
  }
  if(state.remain<=0){ submitExam(true); }
}

function renderExam(){
  const q = state.list[state.idx];
  const total = state.list.length;
  const isSubmitted = !!state.submitted[q.id];
  const answered = state.mode==='practice'
    ? Object.keys(state.submitted).length
    : Object.keys(state.answers).length;
  const pct = Math.round(state.idx/total*100);
  const typeTag = q.type==='single'?'<span class="tag tag-s">单选题</span>':q.type==='multi'?'<span class="tag tag-m">多选题</span>':'<span class="tag tag-j">判断题</span>';

  let optsHtml='';
  if(q.type==='judge'){
    optsHtml = `<div class="judge-opts">
      <div class="opt ${state.answers[q.id]===true?'sel':''}" data-v="true"><span class="k">✓</span> 正确</div>
      <div class="opt ${state.answers[q.id]===false?'sel':''}" data-v="false"><span class="k">✗</span> 错误</div>
    </div>`;
  } else {
    optsHtml = q.options.map(o=>{
      const arr = state.answers[q.id]||[];
      const sel = arr.includes(o.key);
      return `<div class="opt ${sel?'sel':''}" data-k="${o.key}"><span class="k">${o.key}.</span><span>${o.text}</span></div>`;
    }).join('');
  }

  // palette
  // 答题卡：练习模式 —— 10个独立折叠组，每组50题
  const GROUP = 50;
  function cellHtml(qq,i){
    let cls='pcell';
    const done = state.mode==='practice' ? !!state.submitted[qq.id] : state.answers[qq.id]!==undefined;
    if(done) cls+=' done';
    if(i===state.idx) cls+=' cur';
    return `<div class="${cls}" data-i="${i}">${i+1}</div>`;
  }
  let palette;
  {
    const curG = Math.floor(state.idx/GROUP)*GROUP;
    const groups = [];
    for(let s=0; s<state.list.length; s+=GROUP){
      const e = Math.min(s+GROUP, state.list.length);
      const active = s===curG;
      const doneN = state.list.slice(s,e).filter(qq=> state.mode==='practice' ? !!state.submitted[qq.id] : state.answers[qq.id]!==undefined).length;
      const cells = state.list.slice(s,e).map((qq,i)=>cellHtml(qq,s+i)).join('');
      groups.push(`
        <div class="pal-group">
          <div class="collapse-head pal-group-head" data-g="${s}">
            <span class="arrow ${active?'open':''}">▶</span>
            <b style="font-size:13px">第 ${s+1}-${e} 题</b>
            <span style="font-size:12px;color:var(--muted);margin-left:auto">已答 ${doneN}/${e-s}</span>
          </div>
          <div class="collapse-body ${active?'':'closed'}" data-gbody="${s}">
            <div class="palette">${cells}</div>
          </div>
        </div>`);
    }
    palette = groups.join('');
  }

  let timerHtml='';
  if(state.remain>0 || state.mode==='exam'){
    const m = Math.max(0,Math.floor(state.remain/60)), s = Math.max(0,state.remain%60);
    timerHtml = `<div class="timer ${state.remain<=60&&state.remain>0?'warn':''}" id="timer">${state.remain>0?`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:'--:--'}</div>`;
  }

  app.innerHTML = `
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button id="backBtn" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px">←</button>
      <div><b>第 ${state.idx+1} / ${total} 题</b> <span style="color:var(--muted);font-size:12px">已答 ${answered}</span></div>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    ${timerHtml}
  </div>
  ${state.mode==='practice'?`<div style="background:var(--brand-l);color:var(--brand-d);padding:8px 18px;font-size:12px;text-align:center">📖 练习模式 · 进度自动保存，下次打开从第 ${state.idx+1} 题继续</div>`:''}

  <div class="card">
    <div class="qmeta">${typeTag}<span>${q.chapter}</span>
      <button id="favBtn" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:20px;padding:0 4px;line-height:1" title="收藏到错题本">${wrongBook.has(q.id)?'⭐':'☆'}</button>
    </div>
    <div class="qstem">${state.idx+1}. ${q.stem}</div>
    <div id="opts">${optsHtml}</div>
    <div id="fb" class="hidden"></div>
    ${state.mode==='practice' && q.type==='multi' && !isSubmitted ? `
      <div style="margin-top:14px;text-align:center">
        <button class="btn btn-primary" id="confirmBtn">确认答案 ✓</button>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">多选题：请勾选所有正确选项后点"确认答案"</div>
      </div>` : ''}
    <div class="nav">
      <button class="btn btn-ghost" id="prevBtn" ${state.idx===0?'disabled':''}>← 上一题</button>
      ${state.mode==='exam'
        ? `<button class="btn btn-primary" id="nextBtn">${state.idx===total-1?'交卷':'下一题 →'}</button>`
        : (state.idx===total-1
          ? `<button class="btn btn-primary" id="finishBtn">完成练习 🎉</button>`
          : `<button class="btn btn-primary" id="nextBtn">下一题 →</button>`)
      }
    </div>
  </div>

  <div class="card">
    <b>答题卡<span style="font-size:12px;color:var(--muted);font-weight:400;margin-left:8px">点标题展开/收起，点题号跳转</span></b>
    <div style="margin-top:10px">${palette}</div>
    ${state.mode==='exam'?'<div style="margin-top:14px;text-align:center"><button class="btn btn-primary" id="submitBtn">提前交卷</button></div>':''}
  </div>`;

  // option click
  document.querySelectorAll('#opts .opt').forEach(el=>{
    el.onclick = ()=>{
      // 练习模式：已提交的题不再允许修改
      if(state.mode==='practice' && state.submitted[q.id]) return;
      if(q.type==='judge'){
        state.answers[q.id] = el.dataset.v==='true';
        if(state.mode==='practice'){
          state.submitted[q.id] = true;
        }
        renderExam();
        if(state.mode==='practice') showFb(q);
      } else if(q.type==='single'){
        state.answers[q.id] = [el.dataset.k];
        if(state.mode==='practice'){
          state.submitted[q.id] = true;
        }
        renderExam();
        if(state.mode==='practice') showFb(q);
      } else {
        // 多选题：切换选项，不立即判分
        const k = el.dataset.k;
        let arr = state.answers[q.id]||[];
        if(arr.includes(k)) arr = arr.filter(x=>x!==k); else arr.push(k);
        arr.sort();
        state.answers[q.id] = arr;
        renderExam();
      }
    };
  });

  // 多选题"确认答案"按钮
  const cfb = $('confirmBtn');
  if(cfb){
    cfb.onclick = ()=>{
      const arr = state.answers[q.id]||[];
      if(arr.length===0){ alert('请至少选择一个选项'); return; }
      state.submitted[q.id] = true;
      renderExam();
      showFb(q);
    };
  }

  function saveProgress(){
    if(state.mode==='practice' && !state.onlyWrong){
      localStorage.setItem(PRG_KEY, JSON.stringify({idx:state.idx, total:state.list.length}));
    }
  }
  $('prevBtn').onclick = ()=>{ if(state.idx>0){state.idx--;saveProgress();renderExam();window.scrollTo(0,0);} };
  const bb=$('backBtn'); if(bb) bb.onclick = ()=>{
    if(state.timerId){ clearInterval(state.timerId); state.timerId=null; }
    state.onlyWrong=false;
    state.screen='setup';
    renderSetup();
    window.scrollTo(0,0);
  };
  $('nextBtn').onclick = ()=>{
    if(state.idx===total-1 && state.mode==='exam'){ submitExam(false); return; }
    if(state.idx<total-1){state.idx++;saveProgress();renderExam();window.scrollTo(0,0);}
  };
  const sb=$('submitBtn'); if(sb) sb.onclick = ()=>{ if(confirm('确定交卷吗？')) submitExam(false); };
  const fb=$('finishBtn'); if(fb) fb.addEventListener('click', ()=>{
    if(state.timerId){ clearInterval(state.timerId); state.timerId=null; }
    localStorage.removeItem(PRG_KEY);
    state.onlyWrong=false;
    state.screen='setup';
    renderSetup();
    window.scrollTo(0,0);
  });
  const fav=$('favBtn'); if(fav) fav.onclick = ()=>{
    if(wrongBook.has(q.id)){ wrongBook.delete(q.id); fav.textContent='☆'; }
    else { wrongBook.add(q.id); fav.textContent='⭐'; }
    saveWB(wrongBook);
  };
  document.querySelectorAll('.pcell').forEach(el=>{
    el.onclick = ()=>{ state.idx=+el.dataset.i; saveProgress(); renderExam(); window.scrollTo(0,0); };
  });
  // 各组独立折叠
  document.querySelectorAll('.pal-group-head').forEach(h=>{
    h.onclick = (e)=>{
      e.stopPropagation();
      const g = h.dataset.g;
      const body = document.querySelector(`[data-gbody="${g}"]`);
      h.classList.toggle('open');
      h.querySelector('.arrow').classList.toggle('open');
      body.classList.toggle('closed');
    };
  });

  if(state.mode==='practice' && state.submitted[q.id]) showFb(q);
}

function showFb(q){
  const fb = $('fb');
  let correct;
  if(q.type==='judge') correct = state.answers[q.id]===q.answer;
  else correct = JSON.stringify([...(state.answers[q.id]||[])].sort())===JSON.stringify([...q.answer].sort());
  /* 错题本：答错收录；答对且曾在错题本则移除 */
  const wasInBook = wrongBook.has(q.id);
  if(correct){ if(wasInBook){ removeWB(q.id); } }
  else { addWB(q.id); }
  // mark options
  document.querySelectorAll('#opts .opt').forEach(el=>el.classList.add('disabled'));
  if(q.type==='judge'){
    if(q.answer===true) document.querySelectorAll('#opts .opt')[0].classList.add('correct');
    else document.querySelectorAll('#opts .opt')[1].classList.add('correct');
    if(!correct) el0wrong();
  } else {
    q.options.forEach(o=>{
      const el = document.querySelector(`#opts .opt[data-k="${o.key}"]`);
      if(q.answer.includes(o.key)) el.classList.add('correct');
      else if((state.answers[q.id]||[]).includes(o.key)) el.classList.add('wrong');
    });
  }
  let html = `<div class="badge ${correct?'right':'wrong'}">${correct?'✓ 回答正确':'✗ 回答错误'}</div> `;
  if(q.type==='judge'){
    html += `<span style="margin-left:8px">正确答案：<b>${q.answer?'正确':'错误'}</b></span>`;
  } else {
    html += `<span style="margin-left:8px">正确答案：<b>${q.answer.join('')}</b></span>`;
  }
  if(!correct) html += `<span style="margin-left:8px;color:var(--bad);font-size:12px">已自动加入错题本 📕</span>`;
  else if(wasInBook) html += `<span style="margin-left:8px;color:var(--ok);font-size:12px">已移出错题本 ✅</span>`;
  if(q.explain) html += `<div class="explain">解析：${q.explain}</div>`;
  fb.innerHTML = html;
  fb.classList.remove('hidden');
}
function el0wrong(){}

function submitExam(timeUp){
  if(state.timerId){clearInterval(state.timerId);state.timerId=null;}
  state.screen='result';
  // grade
  let right=0, wrong=0, skip=0, newlyAdded=0;
  const review=[];
  state.list.forEach(q=>{
    const ua = state.answers[q.id];
    let ok=false;
    if(ua===undefined||ua===null||(Array.isArray(ua)&&ua.length===0)){ skip++; }
    else{
      if(q.type==='judge') ok = ua===q.answer;
      else ok = JSON.stringify([...ua].sort())===JSON.stringify([...q.answer].sort());
      if(ok) right++; else wrong++;
    }
    /* 考试模式：答错题才收录进错题本，未答题不收 */
    if(ua===undefined||ua===null||(Array.isArray(ua)&&ua.length===0)){
      // 未答，不处理
    } else if(!ok){ if(!wrongBook.has(q.id)){ addWB(q.id); newlyAdded++; } }
    else { if(wrongBook.has(q.id)){ removeWB(q.id); } }
    review.push({q, ua, ok});
    /* 记录已做题（不管对错，只要答了就算做过） */
    if(!(ua===undefined||ua===null||(Array.isArray(ua)&&ua.length===0))){ doneSet.add(q.id); }
  });
  saveDone(doneSet);
  const total = state.list.length;
  const score = Math.round((right/total)*100);
  const pass = score>=60;
  const usedM = Math.floor(state.seconds/60), usedS = state.seconds%60;
  const ringColor = pass ? '#16a34a' : '#dc2626';
  const circ = 2*Math.PI*70;
  const offset = circ*(1-score/100);
  /* 记录历史成绩 */
  addHistory({date:new Date().toISOString(), score, total, right, wrong, skip, seconds:state.seconds, mode:state.mode, onlyWrong:state.onlyWrong, wrongIds: review.filter(r=>{
    const ua = r.ua;
    const unanswered = ua===undefined||ua===null||(Array.isArray(ua)&&ua.length===0);
    return !unanswered && !r.ok;
  }).map(r=>r.q.id)});

  let rvHtml = review.map((r,i)=>{
    const q=r.q;
    const typeTag = q.type==='single'?'<span class="tag tag-s">单选</span>':q.type==='multi'?'<span class="tag tag-m">多选</span>':'<span class="tag tag-j">判断</span>';
    let uaStr;
    if(q.type==='judge') uaStr = r.ua===undefined?'未答':(r.ua?'正确':'错误');
    else uaStr = (!r.ua||r.ua.length===0)?'未答':r.ua.sort().join('');
    let caStr = q.type==='judge'?(q.answer?'正确':'错误'):q.answer.join('');
    let cls = r.ua===undefined||(Array.isArray(r.ua)&&r.ua.length===0)?'wrong':(r.ok?'right':'wrong');
    let badge = r.ua===undefined||(Array.isArray(r.ua)&&r.ua.length===0)?'<span class="badge wrong">未答</span>':(r.ok?'<span class="badge right">正确</span>':'<span class="badge wrong">错误</span>');
    return `<div class="qreview ${cls}">
      <div class="qmeta">${typeTag}${badge} <span style="margin-left:8px">${q.chapter}</span></div>
      <div style="font-weight:600;margin:6px 0">${i+1}. ${q.stem}</div>
      ${q.type!=='judge'?q.options.map(o=>{
        const isCa=q.answer.includes(o.key);
        const isUa=Array.isArray(r.ua)&&r.ua.includes(o.key);
        let st='';
        if(isCa) st='color:var(--ok);font-weight:600';
        else if(isUa) st='color:var(--bad)';
        return `<div style="font-size:13px;${st}">${o.key}. ${o.text}${isCa?' ✓':''}${(!isCa&&isUa)?' ✗':''}</div>`;
      }).join(''):''}
      <div style="font-size:13px;margin-top:6px;color:var(--muted)">你的答案：<b style="color:${cls==='right'?'var(--ok)':'var(--bad)'}">${uaStr}</b> ｜ 正确答案：<b style="color:var(--ok)">${caStr}</b></div>
      ${q.explain?`<div class="explain">解析：${q.explain}</div>`:''}
    </div>`;
  }).join('');

  app.innerHTML = `
  <div class="card" style="text-align:center;padding:32px 24px">
    <div style="font-size:13px;color:var(--muted)">${timeUp?'⏰ 时间到，自动交卷':'考试完成'}</div>
    <div class="score-ring">
      <svg width="160" height="160">
        <circle cx="80" cy="80" r="70" fill="none" stroke="#e2e8f0" stroke-width="10"/>
        <circle cx="80" cy="80" r="70" fill="none" stroke="${ringColor}" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
          style="transition:stroke-dashoffset 1s ease"/>
      </svg>
      <div class="num"><b style="color:${ringColor}">${score}</b><span>分 / 100</span></div>
    </div>
    <div class="score-sub" style="font-size:15px;color:${ringColor};font-weight:600">${pass?'🎉 恭喜，通过考试':'未达 60 分，继续加油'}</div>
    ${newlyAdded>0?`<div style="font-size:13px;color:var(--bad);margin-bottom:10px">📕 本次考试新增 ${newlyAdded} 道错题到错题本，共 ${wrongBook.size} 道待复习</div>`:''}
    ${right>0 && wrong===0 && state.list.length>0?`<div style="font-size:13px;color:var(--ok);margin-bottom:10px">✅ 全部答对，本次涉及的错题已从错题本移除</div>`:''}
    <div class="stat-row">
      <div class="stat ok"><b>${right}</b>答对</div>
      <div class="stat bad"><b>${wrong}</b>答错</div>
      <div class="stat skip"><b>${skip}</b>未答</div>
      <div class="stat"><b>${usedM}'${String(usedS).padStart(2,'0')}"</b>用时</div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn btn-primary" onclick="location.reload()">再考一次</button>
      <button class="btn btn-ghost" onclick="window.print()">打印成绩单</button>
    </div>
  </div>
  <div class="card">
    <b>答题解析（按顺序回顾）</b>
    <div style="margin-top:12px">${rvHtml}</div>
  </div>`;
  window.scrollTo(0,0);
}

/* ===== 登录页 ===== */
function renderLogin(err, showForm){
  const rem = loadRemember();
  // 如果有记住的账号且未强制显示表单，显示一键登录
  if(rem && !showForm){
    app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">🔐</div>
        <h2>欢迎回来</h2>
        <div class="tip">已记住账号，一键进入考试系统</div>
        <div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:16px;text-align:center">
          <div style="font-size:22px;margin-bottom:4px">👤</div>
          <div style="font-weight:700;font-size:16px">${rem.user}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">兑换码 ${rem.code}</div>
        </div>
        <button class="btn btn-primary" id="quickLogin" style="width:100%;justify-content:center;padding:13px">一键登录 →</button>
        <div style="text-align:center;margin-top:14px">
          <a href="javascript:void(0)" id="switchUser" style="font-size:12px;color:var(--muted)">切换账号 / 使用其他兑换码</a>
        </div>
        <div class="login-err">${err||''}</div>
      </div>
    </div>`;
    $('quickLogin').onclick = ()=>{
      localStorage.setItem(SESS_KEY, JSON.stringify({user:rem.user, code:rem.code}));
      renderSetup();
    };
    $('switchUser').onclick = ()=> renderLogin('', true);
    return;
  }
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🔐</div>
      <h2>电源与机房环境基础设施</h2>
      <div class="tip">在线考试系统 · 请输入用户名与兑换码登录</div>
      <input type="text" id="loginUser" placeholder="用户名" maxlength="20" value="${rem?rem.user:''}">
      <input type="text" id="loginCode" placeholder="兑换码（如 XXXX-XXXX）" maxlength="12" value="${rem?rem.code:''}">
      <label style="font-size:12px;color:var(--muted);margin-bottom:12px;display:block">
        <input type="checkbox" id="rememberChk" checked> 记住账号，下次一键登录
      </label>
      <button class="btn btn-primary" id="loginBtn">进入系统 →</button>
      <div class="login-err">${err||''}</div>
    </div>
  </div>`;
  const doLogin = ()=>{
    const u = $('loginUser').value.trim();
    const c = normCode($('loginCode').value);
    const remember = $('rememberChk').checked;
    if(!u){ renderLogin('请输入用户名', true); return; }
    if(!c){ renderLogin('请输入兑换码', true); return; }
    if(!ACCESS_CODES.includes(c)){ renderLogin('兑换码无效，请检查后重试', true); return; }
    const used = loadUsed();
    if(used[c] && used[c]!==u){ renderLogin(`该兑换码已被「${used[c]}」使用，请更换其他兑换码`, true); return; }
    used[c] = u; saveUsed(used);
    localStorage.setItem(SESS_KEY, JSON.stringify({user:u, code:c}));
    if(remember){ localStorage.setItem(REM_KEY, JSON.stringify({user:u, code:c})); }
    else { localStorage.removeItem(REM_KEY); }
    setTimeout(()=>alert(`登录成功！\n兑换码 ${c} 已与用户「${u}」绑定\n下次可直接一键登录`),10);
    renderSetup();
  };
  $('loginBtn').onclick = doLogin;
  $('loginCode').onkeydown = e=>{ if(e.key==='Enter') doLogin(); };
  $('loginUser').onkeydown = e=>{ if(e.key==='Enter') $('loginCode').focus(); };
  setTimeout(()=>$('loginUser').focus(),50);
}
function saveUsed(u){ localStorage.setItem(USED_KEY, JSON.stringify(u)); }
function logout(){ localStorage.removeItem(SESS_KEY); renderLogin(); }

/* 启动：未登录则显示登录页 */
if(loadSession() && loadSession().user){
  renderSetup();
} else {
  renderLogin();
}
</script>
</body>
